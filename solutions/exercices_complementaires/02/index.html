<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiamMiam - EC02</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>MiamMiam</h1>

  <div class="toolbar">
    <input id="search" type="text" placeholder="Rechercher une recette...">
    <button id="add-recipe-btn">Ajouter une recette</button>
  </div>

  <div id="add-recipe"></div>

  <div id="recipes-list">
    <div class="recipe-card" data-id="1">
      <div>
        <h2>Pâtes Carbonara</h2>
        <p>⏱️ 25 min</p>
      </div>
      <button class="delete-btn">Supprimer</button>
    </div>
    <div class="recipe-card" data-id="2">
      <div>
        <h2>Soupe de potiron</h2>
        <p>⏱️ 45 min</p>
      </div>
      <button class="delete-btn">Supprimer</button>
    </div>
    <div class="recipe-card" data-id="3">
      <div>
        <h2>Mousse au chocolat</h2>
        <p>⏱️ 20 min</p>
      </div>
      <button class="delete-btn">Supprimer</button>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
